<!doctype html>

<style>
	.apply-button {
		background-color: rgb(10,102,194);
		color: white;
		border: none;
		height: 34px;
		width: 215px;
		font-weight: bold;
		border-radius: 17px; 
		margin-right: 10px;
		cursor: pointer;
		transition: background-color 0.15s;
	}

  .apply-button:hover {
    background-color: rgb(6, 70, 134);
  }

	.save-button {
		background-color: white;
		color: rgb(10,102,194);
		border-style: solid;
		border-width: 1px;
		border-color: rgb(10,102,194);
		height: 34px;
		width: 70px;
		font-weight: bold;
		border-radius: 17px; 
		margin-right: 10px;
		cursor: pointer;
		transition: border-width 0.15s,
			background-color 0.15s;
	}

	.save-button:hover {
		background-color: rgb(10,102,194, 0.1);
		border-width: 2px;
	}
</style>

<button class="apply-button">
	Apply on company website
</button>

<button class="save-button">
	Save
</button>
